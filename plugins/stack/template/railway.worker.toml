# Railway config for the WORKER service (pg-boss consumer). Same image as web.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bun run worker"
# ALWAYS, with no retry cap: ON_FAILURE gives up after N crashes and the worker then stays down
# silently (no health check covers it) — emails and jobs just stop.
restartPolicyType = "ALWAYS"
