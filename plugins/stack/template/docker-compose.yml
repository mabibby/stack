# Local-dev infrastructure ONLY. The app itself runs natively (`bun run dev`,
# `bun run dev:worker`) for fast reloads; these containers provide the stateful
# bits. Production equivalents: Railway Postgres, a Railway bucket, Resend.
#
# Ports are assigned per app by `stack new` (see AGENTS.md → Local URLs). Container-side ports stay standard.
#   __PORT_PG__  Postgres            __PORT_S3__/__PORT_S3_CONSOLE__  RustFS (S3) API / console
#   __PORT_SMTP__  Mailpit SMTP        __PORT_MAIL__       Mailpit web UI
#
# Image tags are pinned and kept on the newest stable release by /stack:upgrade (the plugin's
# version check flags new ones). Postgres pins only the major: a major bump needs a data reset.

name: __APP_NAME__

services:
  postgres:
    image: postgres:18-alpine
    container_name: __APP_NAME__-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: __DB_NAME__
      POSTGRES_PASSWORD: __DB_NAME__
      POSTGRES_DB: __DB_NAME__
    ports:
      - "__PORT_PG__:5432"
    volumes:
      # Postgres 18 reshuffled the data layout — mount the parent dir so the
      # image manages subdirectories itself.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __DB_NAME__ -d __DB_NAME__"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage (replaces MinIO, whose images were removed from Docker Hub).
  # The bucket + its CORS rule are created by `bun run storage:setup` (run by `bun run setup`).
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: __APP_NAME__-rustfs
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "__PORT_S3__:9000"
      - "__PORT_S3_CONSOLE__:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: __APP_NAME__-mailpit
    restart: unless-stopped
    ports:
      - "__PORT_SMTP__:1025"
      - "__PORT_MAIL__:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rustfs-data:
